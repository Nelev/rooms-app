[project]
name = "rooms-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.124",
    "fastapi[standard]>=0.162.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow-heif>=1.8.1",
    "psycopg[binary,pool]>=3.3.8",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-boto3[s3]>=1.43.124",
    "types-shapely>=2.1.0.20261030",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = [".", "../eval"]
testpaths = ["tests"]

[tool.mypy]
packages = ["app"]
strict = true

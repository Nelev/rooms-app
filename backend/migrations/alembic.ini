# Database migrations, hand-written in raw SQL in versions/. The API applies them when it starts (app.db.migrate).
# From backend/, with DATABASE_URL set:
#   uv run alembic -c migrations/alembic.ini upgrade head                apply what is missing
#   uv run alembic -c migrations/alembic.ini revision -m "what changes"   a new, empty migration to fill in
[alembic]
script_location = %(here)s

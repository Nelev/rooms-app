name: E2E

on:
  push:
    branches: [main]
    paths: ["e2e/**", "backend/**", "frontend/**", "fixtures/**", "data/**", "docker-compose.yml", "Makefile", ".github/workflows/e2e.yml"]
  pull_request: # any base branch: PRs are stacked on their dependency's branch
    paths: ["e2e/**", "backend/**", "frontend/**", "fixtures/**", "data/**", "docker-compose.yml", "Makefile", ".github/workflows/e2e.yml"]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json # the version comes from its packageManager field
          cache: true
          cache_dependency_path: e2e/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Chromium's system libraries; `make e2e` then finds the browser installed
      - name: Install Playwright
        working-directory: e2e
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium

      # The stack built from this commit, the real graph replaying e2e/recordings/: no API keys, no model calls.
      - name: E2E
        run: make e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

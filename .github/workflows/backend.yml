name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "contracts/schemas/**", ".github/workflows/backend.yml"]
  pull_request: # any base branch: PRs are stacked on their dependency's branch
    paths: ["backend/**", "contracts/schemas/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"] # the oldest version requires-python allows, and the one the backend is developed on
    timeout-minutes: 10
    services:
      postgres: # with pgvector: the agent's checkpoints, the store and the projects registry live in Postgres
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rooms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rooms
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type check
        run: uv run mypy

      # No API keys: tests never call real models.
      - name: Test
        run: uv run pytest -q
